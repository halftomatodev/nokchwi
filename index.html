<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>녹취</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#1b1d24">
<script src="lib/lame.min.js"></script>
<style>
  @font-face {
    font-family: 'NeoDunggeunmo';
    font-display: block;
    src: url('lib/neodgm.woff2') format('woff2'), url('lib/neodgm.woff') format('woff');
  }
  :root {
    --bg: #1b1d24;
    --fg: #e8e6df;
    --accent: #f0a63a;
    --font: 'NeoDunggeunmo';
    --panel: color-mix(in srgb, var(--fg) 7%, var(--bg));
    --line: color-mix(in srgb, var(--fg) 18%, var(--bg));
    --muted: color-mix(in srgb, var(--fg) 55%, var(--bg));
    --cut: #e5484d;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font), 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    font-size: 16px; display: flex; flex-direction: column; height: 100vh;
  }
  button, input { font: inherit; color: inherit; }
  button {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 12px; cursor: pointer; touch-action: manipulation; white-space: nowrap;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; border-color: var(--line); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  button.danger { color: var(--cut); }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; border-bottom: 1px solid var(--line); min-height: 52px;
  }
  .brand { color: var(--accent); letter-spacing: 2px; }
  .grow { flex: 1; min-width: 0; }
  .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hint { color: var(--muted); font-size: 14px; line-height: 1.7; }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  #setup { margin: auto; text-align: center; max-width: 480px; padding: 24px 16px; line-height: 1.7; }

  #listBody { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 24px; }
  #recList { list-style: none; margin: 0; padding: 0; }
  #recList button {
    width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
    background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 12px 2px;
  }
  #recList button:hover { background: var(--panel); }
  .recName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recMeta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .pill { font-size: 13px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.done { color: var(--accent); border-color: var(--accent); }
  #empty { padding: 40px 8px; text-align: center; }
  code { background: var(--panel); padding: 1px 5px; border-radius: 4px; font: inherit; }

  #loading { margin: auto; color: var(--muted); padding: 24px; text-align: center; line-height: 1.7; }
  #editorBody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .controls { padding: 8px 16px 0; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; touch-action: none; background: var(--panel); border-radius: 6px; cursor: crosshair; }
  #overview { height: 36px; }
  #zoomWave { height: 92px; margin-top: 6px; }
  .bar { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .bar button { padding: 7px 10px; font-size: 14px; }
  #btnPlay { min-width: 56px; }
  .readout { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; font-size: 14px; color: var(--muted); white-space: nowrap; }
  #clock b { color: var(--fg); font-weight: normal; }
  #selInfo { color: var(--accent); }

  #transcript {
    flex: 1; min-height: 0; overflow-y: auto; margin-top: 10px; padding: 8px 16px 40px;
    border-top: 1px solid var(--line); line-height: 1.95; font-size: 17px;
    overscroll-behavior: contain;
  }
  #transcript p { margin: 0 0 8px; }
  #transcript p::before {
    content: attr(data-t); color: var(--muted); font-size: 12px; margin-right: 8px;
    user-select: none; -webkit-user-select: none;
  }
  .w { cursor: pointer; border-radius: 3px; }
  .w:hover { background: var(--panel); }
  .w.cut { color: color-mix(in srgb, var(--cut) 65%, var(--bg)); text-decoration: line-through; }
  .w.pick { background: color-mix(in srgb, var(--accent) 28%, transparent); }
  .w.on { background: var(--accent); color: var(--bg); }

  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    max-width: calc(100vw - 32px); background: var(--fg); color: var(--bg);
    padding: 9px 14px; border-radius: 6px; font-size: 14px; line-height: 1.5; z-index: 5;
  }
  #toast.err { background: var(--cut); color: #fff; }
</style>
</head>
<body>

<div class="view" id="setupView" hidden>
  <div id="setup">
    <div class="brand">녹취</div>
    <p>PC 폴더에 녹음을 넣으면 자동으로 전사되고, 여기서 텍스트와 파형으로 편집합니다.</p>
    <p class="hint" id="pickHint">드롭박스의 <code>SBSA</code> 안에 <code>NOKCHWI</code> 폴더를 만들어 고르면 됩니다.</p>
    <button id="btnReconnect" class="primary" hidden>다시 연결: <span id="reconnectName"></span></button>
    <button id="btnPick">폴더 선택</button>
    <p class="hint" id="noPicker" hidden>이 브라우저는 PC 폴더를 열 수 없습니다. PC의 Chrome이나 Edge에서 여세요.</p>
  </div>
</div>

<div class="view" id="listView" hidden>
  <header>
    <span class="brand grow">녹취</span>
    <button id="btnChangeFolder">폴더 변경</button>
    <button id="btnUpload" class="primary">녹음 가져오기</button>
    <input type="file" id="fileInput" multiple accept="audio/*,video/mp4,video/quicktime,.m4a,.mp3,.wav,.aac,.flac,.ogg,.opus,.caf" hidden>
  </header>
  <div id="listBody">
    <ul id="recList"></ul>
    <div id="empty" class="hint" hidden>
      녹음이 아직 없습니다. 위의 버튼으로 가져오거나<br>이 폴더 안의 <code>녹음</code> 폴더에 넣으세요.
    </div>
    <p id="batHint" class="hint"></p>
  </div>
</div>

<div class="view" id="editView" hidden>
  <header>
    <button id="btnBack">목록</button>
    <span class="title grow" id="editTitle"></span>
    <button id="btnSave" class="primary" disabled>저장</button>
  </header>
  <div id="loading"></div>
  <div id="editorBody" hidden>
    <div class="controls">
      <canvas id="overview" aria-label="전체 파형"></canvas>
      <canvas id="zoomWave" aria-label="확대 파형: 끌어서 구간 선택"></canvas>
      <div class="readout">
        <span id="clock"></span>
        <span id="selInfo"></span>
      </div>
      <div class="bar">
        <button id="btnPlay">재생</button>
        <button id="btnBack5">-5초</button>
        <button id="btnFwd5">+5초</button>
        <span class="grow"></span>
        <button id="btnZoomOut">축소</button>
        <button id="btnZoomIn">확대</button>
      </div>
      <div class="bar">
        <button id="btnCut" class="danger" disabled>선택 삭제</button>
        <button id="btnKeep" disabled>선택만 남기기</button>
        <button id="btnRestore" disabled>되살리기</button>
        <button id="btnUndo" disabled>실행 취소</button>
        <button id="btnRedo" disabled>다시 실행</button>
      </div>
    </div>
    <div id="transcript"></div>
  </div>
  <audio id="player" preload="auto" playsinline></audio>
</div>

<div id="toast" hidden></div>

<script>
/* ---------- 공통 ---------- */
const $ = s => document.querySelector(s);
const TOOLS_VERSION = '1';
const AUDIO_EXT = /\.(mp3|m4a|wav|aac|flac|ogg|opus|webm|mp4|mov|caf)$/i;
const MIME = {
  mp3: 'audio/mpeg', m4a: 'audio/mp4', mp4: 'audio/mp4', mov: 'video/quicktime', wav: 'audio/wav', aac: 'audio/aac',
  flac: 'audio/flac', ogg: 'audio/ogg', opus: 'audio/ogg', webm: 'audio/webm', caf: 'audio/x-caf',
};
const extOf = name => name.split('.').pop().toLowerCase();
const stemOf = name => name.replace(/\.[^.]+$/, '');
const PEAKS_PER_SEC = 100;
const PEAK_DECODE_RATES = [8000, 22050, 44100];
const FADE_SEC = 0.005;       // 이어 붙인 자리에서 '틱' 소리가 나지 않도록
const MIN_VIEW_SEC = 2;
const DEFAULT_VIEW_SEC = 30;
const HANDLE_PX = 16;
const MIN_SEL_SEC = 0.03;

function fmt(t, tenth) {
  t = Math.max(0, t || 0);
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  const ss = tenth ? s.toFixed(1).padStart(4, '0') : String(Math.floor(s)).padStart(2, '0');
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + ss;
}
function fmtSize(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + 'MB' : Math.ceil(b / 1024) + 'KB'; }
let toastTimer;
function toast(text, isErr, ms = 3500) {
  const el = $('#toast');
  el.textContent = text;
  el.className = isErr ? 'err' : '';
  el.hidden = false;
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => { el.hidden = true; }, ms);
}
function show(id) { for (const v of ['setupView', 'listView', 'editView']) $('#' + v).hidden = v !== id; }

/* ---------- 기기 안 저장소 ---------- */
const dbOpen = new Promise((res, rej) => {
  const r = indexedDB.open('nokchwi', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function kvGet(k) {
  try {
    const db = await dbOpen;
    return await new Promise((res, rej) => {
      const q = db.transaction('kv').objectStore('kv').get(k);
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  } catch { return undefined; }
}
async function kvSet(k, v) {
  try {
    const db = await dbOpen;
    await new Promise((res, rej) => {
      const t = db.transaction('kv', 'readwrite');
      t.objectStore('kv').put(v, k);
      t.oncomplete = res;
      t.onerror = () => rej(t.error);
    });
  } catch {}
}

/* ---------- 시작과 폴더 연결 ---------- */
let rootDir = null, recDir = null;
const nameKey = s => s.normalize('NFC').toLowerCase();
async function start() {
  if (location.protocol === 'https:') navigator.serviceWorker?.register('sw.js').catch(() => {});
  show('setupView');
  if (!window.showDirectoryPicker) {
    $('#btnPick').hidden = true;
    $('#pickHint').hidden = true;
    $('#noPicker').hidden = false;
    return;
  }
  const saved = await kvGet('root');
  if (!saved) return;
  $('#reconnectName').textContent = saved.name;
  $('#btnReconnect').hidden = false;
  $('#btnReconnect').onclick = async () => {
    if (await saved.requestPermission({ mode: 'readwrite' }) === 'granted') await useRoot(saved);
  };
  if (await saved.queryPermission({ mode: 'readwrite' }) === 'granted') await useRoot(saved);
}
async function pickFolder() {
  try {
    const h = await showDirectoryPicker({ id: 'nokchwi', mode: 'readwrite' });
    await kvSet('root', h);
    await useRoot(h);
  } catch (e) { if (e.name !== 'AbortError') toast('폴더를 열 수 없습니다: ' + e.message, true); }
}
$('#btnPick').onclick = pickFolder;
$('#btnChangeFolder').onclick = pickFolder;
async function useRoot(h) {
  rootDir = h;
  recDir = await h.getDirectoryHandle('녹음', { create: true });
  show('listView');
  $('#batHint').innerHTML = '<code></code> 폴더의 <code>전사.bat</code>을 실행해 두면 새 녹음을 자동으로 전사합니다.';
  $('#batHint code').textContent = h.name;
  await refreshList();
  installTools().catch(e => toast('전사.bat을 넣지 못했습니다: ' + e.message, true));
}
async function writeFile(dir, name, blob) {
  const w = await (await dir.getFileHandle(name, { create: true })).createWritable();
  await w.write(blob);
  await w.close();
}
// 전사 프로그램을 앱 폴더에 넣어 둔다
async function installTools() {
  const mark = 'nokchwi.tools:' + rootDir.name;
  const hasBat = await rootDir.getFileHandle('전사.bat').then(() => true, () => false);
  if (hasBat && localStorage.getItem(mark) === TOOLS_VERSION) return;
  const tools = await rootDir.getDirectoryHandle('tools', { create: true });
  const files = [['tools/transcribe.bat', rootDir, '전사.bat'], ['tools/transcribe.py', tools, 'transcribe.py']];
  for (const [src, dir, name] of files) {
    const r = await fetch(src);
    if (!r.ok) throw new Error(src);
    await writeFile(dir, name, await r.blob());
  }
  localStorage.setItem(mark, TOOLS_VERSION);
}

/* ---------- 녹음 목록 ---------- */
let recs = [];
async function readRecs() {
  const audio = [], jsons = new Map();
  for await (const h of recDir.values()) {
    if (h.kind !== 'file') continue;
    if (/\.json$/i.test(h.name)) jsons.set(nameKey(stemOf(h.name)), h);
    else if (AUDIO_EXT.test(h.name)) audio.push(h);
  }
  const out = await Promise.all(audio.map(async h => {
    const f = await h.getFile();
    return { name: h.name, path: h.name, handle: h, rev: f.size + '-' + f.lastModified, size: f.size, at: f.lastModified, json: jsons.get(nameKey(stemOf(h.name))) || null };
  }));
  return out.sort((a, b) => b.at - a.at);
}
async function refreshList() {
  recs = await readRecs();
  const ul = $('#recList');
  ul.replaceChildren(...recs.map(r => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    const body = document.createElement('span');
    body.className = 'grow';
    const name = document.createElement('div');
    name.className = 'recName';
    name.textContent = stemOf(r.name);
    const meta = document.createElement('div');
    meta.className = 'recMeta';
    meta.textContent = new Date(r.at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' · ' + fmtSize(r.size);
    body.append(name, meta);
    const pill = document.createElement('span');
    pill.className = 'pill' + (r.json ? ' done' : '');
    pill.textContent = r.json ? '전사됨' : '전사 대기';
    b.append(body, pill);
    b.onclick = () => { history.pushState({ edit: true }, ''); openRec(r); };
    li.append(b);
    return li;
  }));
  $('#empty').hidden = recs.length > 0;
}
setInterval(() => {
  if (!$('#listView').hidden && !document.hidden && recDir) refreshList().catch(() => {});
}, 5000);

async function takenNames() {
  const names = [];
  for await (const h of recDir.values()) names.push(h.name);
  return names;
}
$('#btnUpload').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = async ev => {
  const files = [...ev.target.files];
  ev.target.value = '';
  for (const [i, f] of files.entries()) {
    toast(`가져오는 중 ${i + 1}/${files.length}: ${f.name}`, false, 0);
    try {
      const taken = new Set((await takenNames()).map(n => nameKey(stemOf(n))));
      let stem = stemOf(f.name);
      for (let n = 2; taken.has(nameKey(stem)); n++) stem = `${stemOf(f.name)}(${n})`;
      await writeFile(recDir, stem + f.name.slice(stemOf(f.name).length), f);
    } catch (e) { toast(e.message, true); return; }
  }
  toast('가져왔습니다.');
  refreshList().catch(() => {});
};

/* ---------- 구간 계산 (지운 구간은 원본 시간 기준의 [시작, 끝] 목록) ---------- */
function mergeCuts(list, dur) {
  const sorted = list.map(([s, e]) => [Math.max(0, s), Math.min(dur, e)]).filter(([s, e]) => e - s > 0.005).sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const [s, e] of sorted) {
    const last = out[out.length - 1];
    if (last && s <= last[1] + 0.02) last[1] = Math.max(last[1], e);
    else out.push([s, e]);
  }
  return out;
}
function subtractCut(cuts, s, e) {
  const out = [];
  for (const [a, b] of cuts) {
    if (b <= s || a >= e) { out.push([a, b]); continue; }
    if (a < s) out.push([a, s]);
    if (b > e) out.push([e, b]);
  }
  return out;
}
function keptRanges(cuts, dur) {
  const out = [];
  let at = 0;
  for (const [s, e] of cuts) {
    if (s > at) out.push([at, s]);
    at = e;
  }
  if (at < dur) out.push([at, dur]);
  return out;
}
const keptLength = (cuts, dur) => keptRanges(cuts, dur).reduce((n, [s, e]) => n + e - s, 0);
const cutAt = (cuts, t) => cuts.find(([s, e]) => t >= s && t < e);

/* ---------- 편집 화면 ---------- */
let c = null;   // 지금 열린 녹음
const player = $('#player');
const canvasOverview = $('#overview'), canvasZoom = $('#zoomWave');
let dirty = true;
const mark = () => { dirty = true; };

async function openRec(rec) {
  const me = c = {
    rec, duration: 0, peaks: null, words: [], spans: [], transcript: null, cuts: [], undo: [], redo: [], sel: null,
    view: { start: 0, len: DEFAULT_VIEW_SEC }, savedSig: '[]', userScrollAt: 0, activeWord: -1, skipTo: -1, skipAt: 0, url: null, saving: false,
  };
  show('editView');
  $('#editTitle').textContent = stemOf(rec.name);
  $('#btnSave').disabled = true;
  $('#editorBody').hidden = true;
  $('#loading').hidden = false;
  $('#loading').textContent = '여는 중…';
  try {
    const blob = await loadAudio(rec);
    if (c !== me) return;
    me.blob = blob;
    $('#loading').textContent = '파형을 만드는 중…';
    const wave = await loadPeaks(rec, blob);
    if (c !== me) return;
    me.peaks = wave.peaks;
    me.duration = wave.duration;
    me.view.len = Math.min(me.duration, DEFAULT_VIEW_SEC);
    me.url = URL.createObjectURL(blob);
    player.src = me.url;
    const draft = await kvGet('draft:' + rec.path + ':' + rec.rev);
    if (c !== me) return;
    if (draft) me.cuts = mergeCuts(draft, me.duration);
    $('#loading').hidden = true;
    $('#editorBody').hidden = false;
    renderTranscript();
    updateButtons();
    mark();
    requestAnimationFrame(frame);
    if (rec.json) await loadTranscript(rec.json);
    else watchForTranscript(me);
  } catch (e) {
    if (c !== me) return;
    $('#loading').textContent = /decod|EncodingError/i.test(e.name + e.message)
      ? '이 브라우저에서 열 수 없는 음성 형식입니다.' : e.message;
  }
}
function closeRec() {
  player.pause();
  if (c?.url) URL.revokeObjectURL(c.url);
  player.removeAttribute('src');
  player.load();
  c = null;
  show('listView');
  refreshList().catch(() => {});
}
$('#btnBack').onclick = () => history.back();
window.addEventListener('popstate', () => { if (c || !$('#editView').hidden) closeRec(); });

async function loadAudio(rec) {
  const f = await rec.handle.getFile();
  return new Blob([f], { type: MIME[extOf(rec.name)] });
}
async function decodeAt(blob, rate) {
  return new OfflineAudioContext(1, 1, rate).decodeAudioData(await blob.arrayBuffer());
}
async function loadPeaks(rec, blob) {
  const key = 'peaks:' + rec.name + ':' + rec.rev;
  const held = await kvGet(key);
  if (held) return held;
  let buf, lastErr;
  // 긴 녹음도 메모리가 넘치지 않게 낮은 음질로 풀어서 파형만 뽑는다
  for (const rate of PEAK_DECODE_RATES) {
    try { buf = await decodeAt(blob, rate); break; }
    catch (e) { lastErr = e; if (e.name === 'EncodingError') throw e; }
  }
  if (!buf) throw lastErr;
  const hop = buf.sampleRate / PEAKS_PER_SEC;
  const n = Math.ceil(buf.length / hop);
  const raw = new Float32Array(n);
  for (let ch = 0; ch < buf.numberOfChannels; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < d.length; i++) {
      const a = Math.abs(d[i]), b = Math.floor(i / hop);
      if (a > raw[b]) raw[b] = a;
    }
  }
  const top = raw.reduce((m, v) => Math.max(m, v), 0.001);
  // 작은 말소리도 보이게 제곱근으로 키운다
  const peaks = Uint8Array.from(raw, v => Math.round(Math.sqrt(v / top) * 255));
  const wave = { peaks, duration: buf.duration };
  await kvSet(key, wave);
  return wave;
}

/* ---------- 전사 텍스트 ---------- */
async function loadTranscript(handle) {
  const me = c;
  const blob = await handle.getFile();
  if (c !== me) return;
  try { me.transcript = JSON.parse(await blob.text()); }
  catch { toast('전사 파일을 읽지 못했습니다.', true); return; }
  renderTranscript();

    if (words.length) out.segments.push({ s: words[0].s, e: words[words.length - 1].e, words });
  }
  return out;
}
function uniqueStem(stem, names) {
  const base = stem.replace(/_편집(\(\d+\))?$/, '') + '_편집';
  const taken = new Set(names.map(n => nameKey(stemOf(n))));
  if (!taken.has(nameKey(base))) return base;
  for (let i = 2; ; i++) if (!taken.has(nameKey(`${base}(${i})`))) return `${base}(${i})`;
}
$('#btnSave').onclick = async () => {
  const me = c;
  if (!me || me.saving) return;
  me.saving = true;
  player.pause();
  updateButtons();
  const say = t => toast(t, false, 0);
  try {
    say('저장 준비 중…');
    const bytes = await me.blob.arrayBuffer();
    const isWav = extOf(me.rec.name) === 'wav';
    const rate = (isWav && wavRate(bytes)) || 44100;
    const buf = await new OfflineAudioContext(1, 1, rate).decodeAudioData(bytes);
    const ranges = keptRanges(me.cuts, buf.duration);
    const channels = joinKept(buf, ranges);
    const blob = isWav ? encodeWav(channels, rate)
      : await encodeMp3(channels, rate, p => say(`변환 중… ${Math.round(p * 100)}%`));
    say('파일에 쓰는 중…');
    const stem = uniqueStem(stemOf(me.rec.name), await takenNames());
    const name = stem + (isWav ? '.wav' : '.mp3');
    // 전사를 먼저 써야 전사 프로그램이 저장본을 다시 전사하지 않는다
    if (me.transcript) {
      await writeFile(recDir, `${stem}.json`, JSON.stringify(remapTranscript(me.transcript, ranges, name)));
    }
    await writeFile(recDir, name, blob);
    me.savedSig = JSON.stringify(me.cuts);
    toast(`저장했습니다: ${name}`);
  } catch (e) {
    toast('저장하지 못했습니다: ' + e.message, true, 0);
  } finally {
    me.saving = false;
    if (c === me) updateButtons();
  }
};

start();
</script>
